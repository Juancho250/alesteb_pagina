<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Neutral bootstrap. Tenant-specific browser metadata is applied after
         the authoritative public profile and published manifest resolve.
         Social crawlers still require domain-aware server-rendered HTML. -->
    <title>Tienda en línea</title>
    <meta name="description" content="Explora productos y conoce nuestra tienda." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Tienda en línea" />
    <meta property="og:description" content="Explora productos y conoce nuestra tienda." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- ① Preconnect Cloudinary (crítico para LCP) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
  </head>
  <body>
    <div id="root"></div>
    <!-- Critical public reads start before React so API latency overlaps JS. -->
    <script>
      (() => {
        // A signed iframe must never prefetch the generic host's tenant data.
        if (new URLSearchParams(window.location.hash.replace(/^#/, "")).has("preview")) return;
        const base = "/api/storefront/public-api/v1";
        const bucket = (window.__ALESTEB_PREFETCH__ = window.__ALESTEB_PREFETCH__ || {});
        const warm = (path) => {
          if (bucket[path]) return;
          bucket[path] = fetch(base + path, {
            headers: { Accept: "application/json" },
            credentials: "same-origin"
          }).then((response) => {
            if (!response.ok) throw new Error("PREFETCH_HTTP_" + response.status);
            return response.json();
          }).catch(() => null);
        };

        warm("/profile");
        warm("/site-manifest");
        warm("/categories");

        const pathname = window.location.pathname;
        if (pathname === "/") {
          warm("/banners");
          warm("/products?limit=4");
        } else if (pathname === "/productos" || pathname.startsWith("/productos/categoria/")) {
          const params = new URLSearchParams({ page: "1", limit: "24" });
          const search = new URLSearchParams(window.location.search).get("search");
          if (search) params.append("search", search);
          if (pathname.startsWith("/productos/categoria/")) {
            params.append("category", decodeURIComponent(pathname.split("/").pop() || ""));
          }
          warm("/products?" + params.toString());
        } else if (pathname.startsWith("/productos/detalle/")) {
          const id = pathname.split("/").pop();
          if (/^\d+$/.test(id || "")) warm("/products/" + id);
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
