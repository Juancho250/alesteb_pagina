    <!-- ═══ Favicon ═══ -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dnnotij4x/image/upload/v1777756428/favicon_hfgk1p.png" />

    <!-- ═══ iPhone ═══ -->
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dnnotij4x/image/upload/e_trim/w_180,h_180,c_pad,b_rgb:0b0b0d/v1777757010/solo_logo_i9cisz.png" />

    <!-- ═══ Preview WhatsApp / redes ═══ -->
    <meta property="og:title" content="Alesteb | Tienda Online" />
    <meta property="og:description" content="Compra en Alesteb. Encuentra los mejores productos con envíos rápidos y precios increíbles." />
    <meta property="og:image" content="https://res.cloudinary.com/dnnotij4x/image/upload/v1777757028/ChatGPT_Image_2_may_2026_14_15_20_mvtgbq.png" />
    <meta property="og:url" content="https://alesteb.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ① Preconnect Cloudinary (crítico para LCP) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
  </head>
  <body>
    <div id="root"></div>
    <!-- Critical public reads start before React so API latency overlaps JS. -->
    <script>
      (() => {
        const base = "/api/storefront/public-api/v1";
        const bucket = (window.__ALESTEB_PREFETCH__ = window.__ALESTEB_PREFETCH__ || {});
        const warm = (path) => {
          if (bucket[path]) return;
          bucket[path] = fetch(base + path, {
            headers: { Accept: "application/json" },
            credentials: "same-origin"
          }).then((response) => {
            if (!response.ok) throw new Error("PREFETCH_HTTP_" + response.status);
            return response.json();
          }).catch(() => null);
        };

        warm("/profile");
        warm("/site-manifest");
        warm("/categories");

        const pathname = window.location.pathname;
        if (pathname === "/") {
          warm("/banners");
          warm("/products?limit=4");
        } else if (pathname === "/productos" || pathname.startsWith("/productos/categoria/")) {
          const params = new URLSearchParams({ page: "1", limit: "24" });
          const search = new URLSearchParams(window.location.search).get("search");
          if (search) params.append("search", search);
          if (pathname.startsWith("/productos/categoria/")) {
            params.append("category", decodeURIComponent(pathname.split("/").pop() || ""));
          }
          warm("/products?" + params.toString());
        } else if (pathname.startsWith("/productos/detalle/")) {
          const id = pathname.split("/").pop();
          if (/^\d+$/.test(id || "")) warm("/products/" + id);
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
