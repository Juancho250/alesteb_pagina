name: Storefront CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
